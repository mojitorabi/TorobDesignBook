name: Build and deploy کتاب دیزاین ترب

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # The build has no dependencies — it runs on the Node standard library
      # alone — so the site GitHub serves is generated from the same source
      # files as the local one, by the same scripts. That is what keeps the
      # two identical rather than merely similar.
      - name: Build
        run: node build/all.mjs

      - name: Verify
        run: node build/verify.mjs

      - name: Disable Jekyll
        run: touch site/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
